<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老实玩新三国梗很枯燥吧</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070b12;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  canvas {
    display: block;
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  /* 底部操作条。按钮给触屏用，不挡住地面 */
  #dock {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: #0c121c;
    border-top: 1px solid rgba(255, 231, 163, 0.18);
    touch-action: manipulation;
  }
  #dock button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    min-height: 44px;
    padding: 0 16px;
    font: 600 15px/1 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #1a1204;
    background: #ffe7a3;
  }
  #dock button.ghost {
    color: #ffe7a3;
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(255, 231, 163, 0.45);
  }
  #dock .vol {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #d7e0ea;
    font: 13px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  #dock input[type="range"] { width: 108px; }
  /* 强平结算。盖住画面和底栏，横屏矮、竖屏窄都能滚完再点下一把 */
  #settle {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 12px;
    background: rgba(4, 8, 14, 0.78);
  }
  #settle[hidden] { display: none !important; }
  #settle .card {
    width: min(460px, 100%);
    max-height: 100%;
    overflow: auto;
    box-sizing: border-box;
    padding: 18px 18px 16px;
    border-radius: 16px;
    background: #101826;
    color: #f4efe4;
    border: 1px solid rgba(255, 231, 163, 0.45);
    font: 15px/1.55 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  #settle h2 {
    margin: 0 0 10px;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: #ffd27a;
  }
  #settle p { margin: 0 0 8px; }
  #settle .events { color: #d7e0ea; word-break: break-word; }
  #settle button {
    margin-top: 12px;
    min-height: 44px;
    width: 100%;
    border: 0;
    border-radius: 999px;
    background: #ffe7a3;
    color: #1a1204;
    font: 600 16px/1 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  @media (max-height: 520px) {
    #settle { align-items: flex-start; padding-top: 8px; }
    #settle .card { padding: 12px 14px; font-size: 13px; line-height: 1.45; }
    #settle h2 { font-size: 18px; margin-bottom: 6px; }
    #settle button { margin-top: 8px; min-height: 40px; }
  }

</head>
<body>
<canvas id="stage"></canvas>
<div id="dock">
  <button type="button" id="btn-heaven">输送天意</button>
  <button type="button" id="btn-add">加仓</button>
  <button type="button" id="btn-sell">卖出</button>
  <button type="button" id="btn-music" class="ghost">声音关</button>
  <label class="vol">音量 <input id="vol" type="range" min="0" max="100" value="40"></label>
</div>
<div id="settle" hidden>
  <div class="card">
    <h2>强平</h2>
    <div id="settle-body"></div>
    <button type="button" id="btn-next">下一把</button>
  </div>

<script>
"use strict";

/** 画布与屏幕尺寸（CSS 像素） */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 1;
let H = 1;

/** 一根 K 线的时长、柱宽、溜溜球周期。MODEL_H 是造型坐标里的身高，DRAW 放大后才是屏幕上的脚到底到冠顶 */
const BAR_MS = 980;
const BODY_W = 11;
const GAP = 6;
const STEP = BODY_W + GAP;
const MODEL_H = 104;
const DRAW = 1.42;
const FOOT = MODEL_H * DRAW;
const PERIOD = 1.22;

/**
 * 行情以自由波动为主，中间可以插入一段阴跌。
 * 从这段波动的低点涨够了，才来一轮天意撤离；
 * 从高点跌够了，才从底部扔出大喇叭。
 * 这两件事之间至少隔 QUIET_MIN 根自由波动。
 * 单边下跌里最多连绿两根，中间要有小反弹。
 */
let candles = [];
let forming = null;
let formStart = 0;
let lastClose = 16;
let regime = "free";
let downStreak = 0;
let crashCool = 0;
let script = [];
let finishScript = false;
const QUIET_MIN = 40;
const EXIT_RISE = 0.12;
const HORN_DROP = 0.12;
let quietLeft = QUIET_MIN;
let swingHigh = 0;
let swingLow = 0;
/** 阴跌还剩几根。这段自由波动走到 grindAt 时开始 */
let grindLeft = 0;
let grindSinceUp = 0;
let grindAt = -1;
/** 三国事件排好的后续 K 线，不重置自由波动 */
let taleQ = [];
/** 每根 K 线触发一条三国事件的概率。不按史序，也不排重 */
const TALE_P = 0.02;
/** 输送天意时，下一根额外增加的事件概率，可连按但封顶。只留给还没生成的那一根 */
const TALE_BOOST_STEP = 0.04;
const TALE_BOOST_CAP = 0.16;
let taleBoost = 0;
/** 正在飞的大喇叭，和 K 线无关 */
let flyingHorns = [];

/** 底仓、每次买卖的股数，以及开局现金。加仓按现价成交，现金不够就记成负债 */
const BASE_SHARES = 1000;
const ADD_SHARES = 200;
const SELL_SHARES = 200;
const START_CASH = 100000;
/** 现金为负时，每 10 根已收盘的 K 线扣一次利息。利率 = (杠杆率 - 1) × 2% */
const INTEREST_EVERY = 10;
const INTEREST_SLOPE = 0.02;
/** 杠杆率达到 2 就是 200%，立刻强平 */
const LIQUIDATION_LEV = 2;
/** 每次输送天意，下根上涨概率增加的幅度，以及封顶 */
const HEAVEN_STEP = 0.07;
const HEAVEN_CAP = 0.62;
/** 每次输送天意时，下一根直接跌停的概率 */
const LIMIT_DOWN_P = 0.035;
const LIMIT_DOWN_RET = -0.1;

/** 持仓、现金、成本、天意。天意只作用在下一根还没生成的 K 线上 */
let shares = 0;
let cash = START_CASH;
let avgCost = 0;
/** 这一把开局时的净资产，用来算结算盈亏比 */
let initialEquity = 0;
/** 这一把见过的最高净资产，以及对应的最高盈利比 */
let peakEquity = 0;
let peakRatio = 0;
/** 这一把已经收盘的 K 线根数，专供利息计数，不含开局预填的历史 */
let closedBars = 0;
/** 这一把遇到过的三国事件名，按第一次出现的顺序，不重复记 */
let seenTales = [];
let liquidated = false;
let heavenCount = 0;
let heavenBoost = 0;
let heavenLimitDown = false;
/** 阿斗真正拍到地上的次数，提起来但还没落地的不算 */
let slamCount = 0;

/** 阿斗状态机：yoyo 甩动 / windup 提起 / fall 下坠 / splat 拍地 / dazed 眼冒金星 / reel 拉回 */
let state = "yoyo";
let stateT = 0;
let aduX = 0;
let aduY = 0;
let aduRot = 0;
let aduSx = 1;
let aduSy = 1;
let vx = 0;
let vy = 0;
let rotV = 0;
let pendingSlam = false;
let slamPct = 0;
let shake = 0;
let flash = 0;
let fromX = 0;
let fromY = 0;
let fromRot = 0;

/** 尘土、裂纹、飘字 */
let particles = [];
let cracks = [];
let floaters = [];

/** 把价格和进度限制在可用区间里 */
function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

/** 地面接触线。阿斗的脚以这条线为落点 */
function groundY() {
  return H - 28;
}

/** 行情绘图区 */
function chartBox() {
  return { left: 12, right: W - 68, top: 58, bottom: groundY() - 6 };
}

/** 普通摆动时脚离地至少 16px，跌破 5% 才允许落到地板上 */
function maxAmp() {
  const handLow = 70;
  return Math.max(90, groundY() - 16 - FOOT - handLow - 14);
}

/** 手左右甩开的距离 */
function swingReach() {
  return Math.min(190, W * 0.18);
}

/** 0 到 1 的平滑插值 */
function easeInOut(u) {
  const t = clamp(u, 0, 1);
  return t * t * (3 - 2 * t);
}

/** 圆角矩形路径 */
function roundRect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/** 按当前时间取出溜溜球相位 0..1 */
function phase(now) {
  const t = now / 1000;
  const p = (t % PERIOD) / PERIOD;
  return { t, p };
}

/** 特殊行情结束后，重新开始一段足够长的自由波动，高低点也从这里重计 */
function beginQuiet(price) {
  regime = "free";
  quietLeft = QUIET_MIN + Math.floor(Math.random() * 18);
  swingHigh = price;
  swingLow = price;
  grindLeft = 0;
  grindSinceUp = 0;
  // 自由波动的中段磨一段阴跌，不占用天意撤离和吹喇叭的间隔
  grindAt = 12 + Math.floor(Math.random() * 16);
}

/** 底部吹喇叭时的价格只是一小段普通上涨，喇叭本身另外画 */
function pushHornRise() {
  const bars = 7;
  let sincePull = 0;
  let launched = false;
  for (let i = 0; i < bars; i++) {
    if (sincePull >= 2 && Math.random() < 0.65) {
      script.push({ ret: -(0.004 + Math.random() * 0.004), kind: "free", launch: false });
      sincePull = 0;
    } else {
      script.push({ ret: 0.009 + Math.random() * 0.012, kind: "free", launch: !launched });
      launched = true;
      sincePull += 1;
    }
  }
  regime = "script";
}

/**
 * 涨高之后天意撤离。
 * 绿柱仍带超长上影，但每连跌两根就插一根小阳，不能一路纯绿。
 */
function pushHeavenExit() {
  const bars = 8 + Math.floor(Math.random() * 3);
  let sinceUp = Math.min(2, downStreak);
  for (let i = 0; i < bars; i++) {
    if (sinceUp >= 2) {
      script.push({ ret: 0.004 + Math.random() * 0.006, kind: "free", launch: false });
      sinceUp = 0;
    } else {
      script.push({ ret: -(0.016 + Math.random() * 0.018), kind: "exit", launch: false });
      sinceUp += 1;
    }
  }
  regime = "script";
}

/** 阴跌的下一根：小阴为主，连着两根就反弹一小段，不允许第三根还是绿 */
function grindStep() {
  grindLeft -= 1;
  let ret;
  const needBounce = downStreak >= 2 || grindSinceUp >= 2 || (grindSinceUp === 1 && Math.random() < 0.28);
  if (needBounce) {
    ret = 0.003 + Math.random() * 0.005;
    grindSinceUp = 0;
  } else {
    ret = -(0.006 + Math.random() * 0.008);
    grindSinceUp += 1;
  }
  return { ret, kind: ret < 0 ? "grind" : "free", launch: false };
}

/**

const TALES = [

/** 把一条三国事件拆成一根或连续几根特殊 K 线 */
function pushTale(tale) {
  const span = Math.max(1, tale.span || 1);
  let since = Math.min(2, downStreak);
  const steps = [];
  function add(ret, shape) {
    steps.push({
      ret,
      shape,
      kind: "tale",
      launch: false,
      taleTitle: steps.length ? "" : tale.title,
      taleLine: steps.length ? "" : tale.line
    });
  }
  if (tale.shape === "crash") {
    if (since >= 2) add(0.005 + Math.random() * 0.003, "bounce");
    add(-(0.062 + Math.random() * 0.02), "crash");
  } else if (tale.shape === "rise") {
    let up = 0;
    for (let i = 0; i < span; i++) {
      if (up >= 2) {
        add(-(0.003 + Math.random() * 0.004), "bounce");
        up = 0;
      } else {
        add(0.007 + Math.random() * 0.009, "rise");
        up += 1;
      }
    }
  } else if (tale.shape === "fall" || tale.shape === "burn") {
    for (let i = 0; i < span; i++) {
      if (since >= 2) {
        add(0.004 + Math.random() * 0.005, "bounce");
        since = 0;
      } else {
        const mag = tale.shape === "burn" ? 0.012 + Math.random() * 0.012 : 0.007 + Math.random() * 0.008;
        add(-mag, tale.shape);
        since += 1;
      }
    }
  } else if (tale.shape === "duel") {
    for (let i = 0; i < span; i++) {
      const mag = 0.008 + Math.random() * 0.01;
      if (since >= 2 || i % 2 === 1) {
        add(mag, "duel");
        since = 0;
      } else {
        add(-mag, "duel");
        since += 1;
      }
    }
  } else if (tale.shape === "reversal") {
    for (let i = 0; i < Math.max(1, span - 1); i++) {
      if (since >= 2) {
        add(0.004 + Math.random() * 0.003, "bounce");
        since = 0;
      } else {
        add(-(0.008 + Math.random() * 0.008), "burn");
        since += 1;
      }
    }
    add(0.018 + Math.random() * 0.012, "maruUp");
  } else if (tale.shape === "dojiRise") {
    if (since >= 2) add(0.004 + Math.random() * 0.003, "bounce");
    add((Math.random() - 0.5) * 0.002, "doji");
    add(0.01 + Math.random() * 0.008, "rise");
  } else if (tale.shape === "dragon") {
    add(0.004 + Math.random() * 0.008, "dragon");
  } else if (tale.shape === "spikeDown") {
    if (since >= 2) add(0.004 + Math.random() * 0.003, "bounce");
    add(-(0.01 + Math.random() * 0.012), "spikeDown");
  } else if (tale.shape === "spikeUp") {
    add(0.01 + Math.random() * 0.012, "spikeUp");
  } else if (tale.shape === "doji") {
    let ret = (Math.random() - 0.5) * 0.0024;
    if (since >= 2 && ret < 0) ret = 0.001 + Math.random() * 0.0015;
    add(ret, "doji");
  } else if (tale.shape === "tongue") {
    add(0.006 + Math.random() * 0.008, "tongue");
  } else if (tale.shape === "maruUp") {
    add(0.024 + Math.random() * 0.012, "maruUp");
  } else if (tale.shape === "maruDown") {
    if (since >= 2) add(0.004 + Math.random() * 0.003, "bounce");
    add(-(0.022 + Math.random() * 0.012), "maruDown");
  } else {
    add(0.006, "rise");
  }
  taleQ.push(...steps);
}

/** 三国事件的字幕。样式接近天意播报，多一行事件名。停留 3 秒 */
function showTale(title, line) {
  if (title && !seenTales.includes(title)) seenTales.push(title);
  const spot = announceAt(0, -56, true);
  floaters.push({
    banner: true,
    title,
    text: line,
    x: spot.x,
    y: spot.y,
    vy: -4,
    life: 3,
    age: 0,
    size: 22,
    color: "#fff6d8"
  });
}

/** 自由波动。最多连跌两根，偶尔一根跌破 5% 让阿斗摔下去 */
function freeStep() {
  crashCool = Math.max(0, crashCool - 1);
  let ret = (Math.random() + Math.random() - 1) * 0.03;
  if (downStreak >= 2 && ret < 0) ret = 0.006 + Math.random() * 0.014;
  else if (crashCool === 0 && downStreak === 0 && Math.random() < 0.08) {
    ret = -(0.058 + Math.random() * 0.03);
    crashCool = 10;
  } else {
    ret = clamp(ret, -0.028, 0.028);
  }
  return { ret, kind: ret <= -0.05 ? "crash" : "free", launch: false };
}

/** 下一根 K 线。安静期没走完时，不允许吹喇叭，也不允许天意撤离 */
function takeStep(price) {
  if (taleQ.length) return taleQ.shift();
  // 天意加成只掷一次，用在即将生成的这一根上；没有加成时，剧本进行中不插事件
  const boosted = taleBoost > 0;
  const taleP = boosted ? Math.min(0.4, TALE_P + taleBoost) : TALE_P;
  if (boosted) taleBoost = 0;
  if (script.length && !boosted) {
    const step = script.shift();
    if (!script.length) finishScript = true;
    return step;
  }
  if (Math.random() < taleP) {
    pushTale(TALES[Math.floor(Math.random() * TALES.length)]);
    return takeStep(price);
  }
  if (script.length) {
    const step = script.shift();
    if (!script.length) finishScript = true;
    return step;
  }
  if (grindLeft > 0) return grindStep();
  if (quietLeft > 0) {
    quietLeft -= 1;
    if (quietLeft === grindAt) {
      grindLeft = 12 + Math.floor(Math.random() * 7);
      grindSinceUp = Math.min(2, downStreak);
      return grindStep();
    }
    return freeStep();
  }
  const fromLow = swingLow > 0 ? (price - swingLow) / swingLow : 0;
  const fromHigh = swingHigh > 0 ? (swingHigh - price) / swingHigh : 0;
  if (fromHigh >= HORN_DROP && fromHigh >= fromLow) {
    pushHornRise();
    return takeStep(price);
  }
  if (fromLow >= EXIT_RISE) {
    pushHeavenExit();
    return takeStep(price);
  }
  return freeStep();
}

/**
 * 用掉已经攒下的天意，只影响这一根即将生成的 K 线。
 * 跌停优先于上涨加成；上涨加成只在原本会收阴时，按概率把它翻成小阳。
 */
function consumeHeaven(step) {
  const limit = heavenLimitDown;
  const boost = heavenBoost;
  heavenLimitDown = false;
  heavenBoost = 0;
  if (limit) {
    return { ...step, ret: LIMIT_DOWN_RET, kind: "limit", shape: "crash" };
  }
  if (boost > 0 && step.ret < 0 && Math.random() < boost) {
    return {
      ...step,
      ret: 0.006 + Math.random() * 0.016,
      shape: "bounce",
      kind: "tale"
    };
  }
  return step;
}

/** 折线采样：times 单调递增，落在 0..1 */
function evalPath(pts, times, t) {
  const u = clamp(t, 0, 1);
  for (let i = 1; i < times.length; i++) {
    if (u <= times[i]) {
      const span = times[i] - times[i - 1] || 1;
      const k = (u - times[i - 1]) / span;
      return pts[i - 1] + (pts[i] - pts[i - 1]) * k;
    }
  }
  return pts[pts.length - 1];
}

/** 三国事件的特殊形态。没有对应形状时返回空，走普通 K 线 */
function shapePath(step, open, close, prev) {
  const shape = step.shape;
  if (!shape || shape === "rise" || shape === "bounce" || shape === "fall") return null;
  if (shape === "crash") return null;
  if (shape === "dragon" || shape === "spikeDown" || shape === "tongue") {
    const lift = shape === "dragon" ? 0.055 : shape === "tongue" ? 0.038 : 0.046;
    const high = Math.max(open, prev) * (1 + lift + Math.random() * 0.02);
    const low = Math.min(open, close) * (1 - (shape === "tongue" ? 0.014 : 0.002));
    return { pts: [open, high, low, close], times: [0, 0.24, 0.78, 1] };
  }
  if (shape === "spikeUp") {
    const low = Math.min(open, close, prev) * (1 - 0.03 - Math.random() * 0.018);
    const high = Math.max(open, close) * (1 + 0.004);
    return { pts: [open, low, high, close], times: [0, 0.28, 0.7, 1] };
  }
  if (shape === "doji") {
    const high = prev * (1.012 + Math.random() * 0.012);
    const low = prev * (0.988 - Math.random() * 0.012);
    return { pts: [open, high, low, close], times: [0, 0.3, 0.7, 1] };
  }
  if (shape === "maruUp" || shape === "maruDown") {
    const high = Math.max(open, close) * 1.0012;
    const low = Math.min(open, close) * 0.9988;
    return { pts: [open, low, high, close], times: [0, 0.2, 0.55, 1] };
  }
  if (shape === "duel") {
    const high = Math.max(open, close, prev) * (1.012 + Math.random() * 0.01);
    const low = Math.min(open, close, prev) * (0.988 - Math.random() * 0.01);
    return { pts: [open, high, low, close], times: [0, 0.3, 0.7, 1] };
  }
  if (shape === "burn") {
    const high = Math.max(open, prev) * (1.028 + Math.random() * 0.018);
    const low = Math.min(open, close) * 0.998;
    return { pts: [open, high, low, close], times: [0, 0.22, 0.75, 1] };
  }
  return null;
}

/**
 * 造一根 K 线。live 为真时，跌破 5% 才会把阿斗摔下去。
 * 喇叭口朝上：上影随 flare 拉长。
 */
function makeCandle(prev, live) {
  const raw = takeStep(prev);
  if (live && raw.launch) launchHorns();
  const step = live ? consumeHeaven(raw) : raw;
  if (live && step.taleTitle) showTale(step.taleTitle, step.taleLine);
  const ret = step.ret;
  const close = Math.max(1.5, prev * (1 + ret));
  const open = prev * (1 + (Math.random() - 0.5) * 0.0025);
  let pts;
  let times;
  const shaped = shapePath(step, open, close, prev);
  if (shaped) {
    pts = shaped.pts;
    times = shaped.times;
  } else if (step.kind === "exit") {
    // 先冲高，再收在更低的位置，留下很长的上影，颜色按收盘相对前收算是绿
    const high = Math.max(open, prev) * (1 + 0.07 + Math.random() * 0.06);
    const low = Math.min(open, close) * (1 - 0.003);
    pts = [open, high, low, close];
    times = [0, 0.22, 0.78, 1];
  } else if (step.kind === "grind") {
    // 阴跌：实体小，上影略长于实体，收在这根的下半
    const high = Math.max(open, prev) * (1 + 0.004 + Math.random() * 0.008);
    const low = Math.min(open, close) * (1 - Math.random() * 0.003);
    pts = [open, high, low, close];
    times = [0, 0.28, 0.72, 1];
  } else if (ret <= -0.05) {
    const top = Math.max(open, prev) * (1 + Math.random() * 0.005);
    const low = close * (1 - Math.random() * 0.008);
    pts = [open, top, low, close];
    times = [0, 0.16, 0.78, 1];
  } else if (ret >= 0) {
    const low = Math.min(open, close) * (1 - Math.random() * 0.006);
    const high = Math.max(open, close) * (1 + Math.random() * 0.008);
    pts = [open, low, high, close];
    times = [0, 0.34, 0.68, 1];
  } else {
    const high = Math.max(open, close) * (1 + Math.random() * 0.006);
    const low = Math.min(open, close) * (1 - Math.random() * 0.008);
    pts = [open, high, low, close];
    times = [0, 0.34, 0.7, 1];
  }
  if (close < prev) downStreak += 1;
  else downStreak = 0;
  if (finishScript) {
    finishScript = false;
    beginQuiet(close);
  } else if (regime === "free") {
    if (close > swingHigh) swingHigh = close;
    if (close < swingLow) swingLow = close;
  }
  const hi = Math.max(...pts);
  const lo = Math.min(...pts);
  return {
    prev,
    o: open,
    h: hi,
    l: lo,
    c: close,
    pts,
    times,
    crash: !!live && ret <= -0.05,
    kind: step.kind,
    hornId: step.hornId || 0,
    slammed: false,
    seenH: open,
    seenL: open,
    live: open
  };
}

/** 当前这根 K 线走到哪了，1 表示收盘 */
function formProgress(now) {
  if (!forming) return 0;
  return clamp((now - formStart) / BAR_MS, 0, 1);
}

/** 相对前收的实时涨跌幅。跌破 -0.05 就会触发摔跤 */
function liveReturn(now) {
  if (!forming) return 0;
  const price = evalPath(forming.pts, forming.times, formProgress(now));
  return (price - forming.prev) / forming.prev;
}

/** 预填一段历史，打开页面就能看见一整面 K 线。走势和实时用的是同一套阶段机 */
function bootstrapMarket(now) {
  let price = 16 + Math.random() * 8;
  candles = [];
  regime = "free";
  quietLeft = 6;
  downStreak = 0;
  grindLeft = 0;
  grindSinceUp = 0;
  grindAt = 3;
  taleQ = [];
  taleBoost = 0;
  swingHigh = price;
  swingLow = price;
  crashCool = 4;
  script = [];
  finishScript = false;
  flyingHorns = [];
  for (let i = 0; i < 120; i++) {
    const cd = makeCandle(price, false);
    candles.push(cd);
    price = cd.c;
  }
  lastClose = price;
  shares = BASE_SHARES;
  cash = START_CASH;
  avgCost = price;
  initialEquity = cash + shares * price;
  peakEquity = initialEquity;
  peakRatio = 0;
  closedBars = 0;
  seenTales = [];
  liquidated = false;
  heavenCount = 0;
  slamCount = 0;
  heavenBoost = 0;
  taleBoost = 0;
  heavenLimitDown = false;
  forming = makeCandle(price, true);
  formStart = now;
}

/** 收盘并接上下一根。历史数组只保留屏幕装得下的量 */
function rollCandle(now) {
  if (!forming || liquidated) return;
  const done = forming;
  done.live = done.c;
  done.seenH = done.h;
  done.seenL = done.l;
  candles.push(done);
  if (candles.length > 240) candles.splice(0, candles.length - 240);
  lastClose = done.c;
  closedBars += 1;
  if (closedBars % INTEREST_EVERY === 0) chargeInterest(done.c);
  forming = makeCandle(done.c, true);
  formStart = now;
  maybeLiquidate(done.c);
}

/** 手的位置。每轮开始时手腕向下抖一下，像把溜溜球甩出去 */
function handTarget(now) {
  const { t, p } = phase(now);
  const swing = Math.sin((t / PERIOD) * Math.PI * 2);
  const reach = swingReach();
  let flick = 0;
  if (p < 0.16) flick = Math.sin((p / 0.16) * Math.PI);
  return {
    x: W * 0.5 + swing * reach,
    y: 48 + flick * 18,
    rot: -flick * 0.9
  };
}

/**
 * 甩动目标。脚的纵坐标由绳子长度决定：
 * 涨了绳子收短，跌了绳子放长，但常态下脚停在地面上方。
 */
function yoyoTarget(now) {
  const { t, p } = phase(now);
  let drop;
  let squash;
  // 先加速下甩，在底部停一停，再猛地收回。涨则收短，跌则放长
  if (p < 0.32) {
    const k = p / 0.32;
    drop = k * k;
    squash = k;
  } else if (p < 0.6) {
    drop = 1;
    squash = 1;
  } else {
    const k = (p - 0.6) / 0.4;
    drop = (1 - k) * (1 - k);
    squash = 1 - k;
  }
  const ret = liveReturn(now);
  const room = maxAmp();
  const portion = clamp(0.86 - ret * 6.5, 0.46, 1);
  const amp = room * portion;
  const hand = handTarget(now);
  const reach = swingReach();
  const lag = Math.sin((t / PERIOD) * Math.PI * 2 - 0.55);
  const farX = W * 0.5 + lag * reach;
  const x = hand.x + (farX - hand.x) * drop;
  const hatY = hand.y + 14 + amp * drop;
  const y = hatY + FOOT;
  const lean = clamp((x - hand.x) / 220, -0.45, 0.45);
  const sy = drop > 0.92 ? 0.9 : 1 + squash * 0.08;
  const sx = drop > 0.92 ? 1.08 : 1 - squash * 0.05;
  let expr = "blank";
  if (drop > 0.9) expr = "gforce";
  return { x, y, rot: lean, sx, sy, drop, expr, ret };
}

/** 冠顶世界坐标，用来接绳子 */
function hatWorld() {
  if (state === "fall") {
    return {
      x: aduX + Math.sin(aduRot) * 16,
      y: aduY - FOOT * 0.78,
      slack: true
    };
  }
  if (state === "splat" || state === "dazed") {
    return { x: aduX, y: aduY - FOOT * aduSy, slack: true };
  }
  return {
    x: aduX + Math.sin(aduRot) * FOOT * aduSy,
    y: aduY - Math.cos(aduRot) * FOOT * aduSy,
    slack: false
  };
}

/** 开始把阿斗提回手边，下一帧进入下坠 */
function beginWindup(now) {
  state = "windup";
  stateT = 0;
  fromX = aduX;
  fromY = aduY;
  fromRot = aduRot;
  flash = Math.max(flash, 0.08);
}

/** 绳子松开，给一个向下的初速度 */
function beginFall() {
  state = "fall";
  stateT = 0;
  vy = 220;
  vx = (aduX - W * 0.5) * 0.35;
  rotV = (aduX > W * 0.5 ? 1 : -1) * 1.5;
  sfxFall();
  aduSx = 0.86;
  aduSy = 1.22;
}

/** 触地：压扁、震屏、扬尘 */
function beginSplat() {
  state = "splat";
  stateT = 0;
  aduY = groundY();
  vy = 0;
  vx *= 0.2;
  aduRot = clamp(aduRot, -0.4, 0.4);
  shake = 20 + Math.min(16, Math.abs(slamPct));
  flash = 0.72;
  slamCount += 1;
  sfxSplat();
  spawnImpact(aduX);
  floaters.push({
    text: "啪",
    x: aduX + 36,
    y: groundY() - 70,
    vy: -70,
    life: 0.7,
    age: 0,
    size: 54,
    color: "#ffe7a3"
  });
  const fallMsg = announceAt(0, 0);
  floaters.push({
    text: `跌 ${Math.abs(slamPct).toFixed(1)}%`,
    x: fallMsg.x,
    y: fallMsg.y,
    vy: -8,
    life: 1.65,
    age: 0,
    size: 42,
    color: "#3dde9a"
  });
}

/** 播报位置。落在持仓卡和说明卡下面，横屏并排时只避开更高的那一张 */
function announceAt(dx, dy, banner) {
  const occupied = Math.max(accountBox().y + accountBox().h, helpBox().y + helpBox().h);
  const clearTop = occupied + (banner ? 36 : 20);
  const y = clamp(H * 0.5 + dy, clearTop, Math.max(clearTop, H - 120));
  const x = clamp(W * 0.5 + dx, 72, Math.max(72, W - 72));
  return { x, y };
}

/** 左上角持仓卡。窄屏拉满，宽屏限宽，给右边的说明卡留位置 */
function accountBox() {
  const w = W < 700 ? W - 28 : Math.min(440, Math.floor((W - 36) * 0.48));
  return { x: 14, y: 66, w: Math.max(200, w), h: 122 };
}

/** 说明卡。宽屏跟持仓卡并排，窄屏或挤不下时排到持仓卡下面 */
function helpBox() {
  const h = 90;
  const account = accountBox();
  const stacked = { x: 14, y: account.y + account.h + 8, w: Math.min(460, W - 28), h };
  if (W < 700) return stacked;
  const w = Math.min(460, W - account.x - account.w - 8 - 14);
  const x = W - w - 14;
  if (w < 220 || x < account.x + account.w + 8) return stacked;
  return { x, y: 12, w, h };
}

/** 在地上躺一会儿 */
function beginDazed() {
  state = "dazed";
  stateT = 0;
  aduY = groundY();
}

/** 绳子重新绷紧，拉回溜溜球轨迹 */
function beginReel() {
  state = "reel";
  stateT = 0;
  fromX = aduX;
  fromY = aduY;
  fromRot = aduRot;
}

/** 跌破 5% 时调用。如果还躺着，就等站起来再摔下一次 */
function triggerSlam(ret) {
  slamPct = ret * 100;
  if (state === "yoyo") beginWindup();
  else pendingSlam = true;
}

/** 拍地时的尘土和地面裂纹 */
function spawnImpact(x) {
  for (let i = 0; i < 18; i++) {
    const a = Math.PI + Math.random() * Math.PI;
    const sp = 90 + Math.random() * 260;
    particles.push({
      x,
      y: groundY() - 2,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 30,
      life: 0.45 + Math.random() * 0.45,
      age: 0,
      r: 2 + Math.random() * 3.2,
      color: Math.random() < 0.5 ? "#d9c7a4" : "#8f8576"
    });
  }
  cracks.push({ x, life: 2.6, age: 0, seed: Math.random() * 10 });
}

/** 物理与行情推进 */
function update(dt, now) {
  if (liquidated) return;
  if (forming) {
    const prog = formProgress(now);
    const price = evalPath(forming.pts, forming.times, prog);
    forming.live = price;
    forming.seenH = Math.max(forming.seenH, price);
    forming.seenL = Math.min(forming.seenL, price);
    // 刚跌破 5% 就摔。牌子上写这根 K 线的最终跌幅，而不是刚越过门槛的那一瞬间
    if (!forming.slammed && liveReturn(now) <= -0.05) {
      forming.slammed = true;
      triggerSlam((forming.c - forming.prev) / forming.prev);
    }
    if (maybeLiquidate(price)) return;
    if (prog >= 1) {
      rollCandle(now);
      if (liquidated) return;
    }
  }

  const pose = yoyoTarget(now);
  const hand = handTarget(now);

  if (state === "yoyo") {
    if (pendingSlam) {
      pendingSlam = false;
      beginWindup(now);
    } else {
      aduX = pose.x;
      aduY = pose.y;
      aduRot = pose.rot;
      aduSx = pose.sx;
      aduSy = pose.sy;
    }
  } else if (state === "windup") {
    stateT += dt;
    const u = clamp(stateT / 0.16, 0, 1);
    const e = 1 - Math.pow(1 - u, 3);
    const targetY = hand.y + 18 + FOOT;
    aduX = fromX + (hand.x - fromX) * e;
    aduY = fromY + (targetY - fromY) * e;
    aduRot = fromRot * (1 - e);
    aduSx = 1 - 0.16 * e;
    aduSy = 1 + 0.28 * e;
    if (u >= 1) beginFall();
  } else if (state === "fall") {
    stateT += dt;
    vy += 3600 * dt;
    aduX += vx * dt;
    aduY += vy * dt;
    aduRot = clamp(aduRot + rotV * dt, -0.9, 0.9);
    const sp = clamp(vy / 1600, 0, 1);
    aduSx = 0.9 - 0.08 * sp;
    aduSy = 1.15 + 0.18 * sp;
    if (aduY >= groundY()) {
      aduY = groundY();
      beginSplat();
    }
  } else if (state === "splat") {
    stateT += dt;
    const u = clamp(stateT / 0.2, 0, 1);
    const hop = Math.sin(u * Math.PI);
    aduY = groundY() - hop * 22;
    aduSx = 1.46 - 0.16 * u;
    aduSy = 0.42 + 0.12 * u;
    aduRot *= 0.9;
    if (stateT >= 0.22) beginDazed();
  } else if (state === "dazed") {
    stateT += dt;
    aduY = groundY();
    aduSx = 1.34;
    aduSy = 0.5;
    aduRot = Math.sin(stateT * 22) * 0.05 * Math.max(0, 1 - stateT);
    if (stateT >= 1.12) beginReel();
  } else if (state === "reel") {
    stateT += dt;
    const u = easeInOut(stateT / 0.48);
    aduX = fromX + (pose.x - fromX) * u;
    aduY = fromY + (pose.y - fromY) * u;
    aduRot = fromRot + (pose.rot - fromRot) * u;
    aduSx = 1.34 + (pose.sx - 1.34) * u;
    aduSy = 0.5 + (pose.sy - 0.5) * u;
    if (u > 0.72) aduSy += Math.sin(((u - 0.72) / 0.28) * Math.PI) * 0.12;
    if (stateT >= 0.48) {
      state = "yoyo";
      stateT = 0;
    }
  }

  shake = Math.max(0, shake - dt * 32);
  flash = Math.max(0, flash - dt * 1.8);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > groundY()) {
      p.y = groundY();
      p.vy *= -0.25;
      p.vx *= 0.8;
    }
    if (p.age >= p.life) particles.splice(i, 1);
  }
  for (let i = cracks.length - 1; i >= 0; i--) {
    cracks[i].age += dt;
    if (cracks[i].age >= cracks[i].life) cracks.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.age += dt;
    f.y += f.vy * dt;
    f.vy *= 0.98;
    if (f.age >= f.life) floaters.splice(i, 1);
  }
  updateFlyingHorns(dt);
}

/** 从地板上往上扔出几只大喇叭 */
function launchHorns() {
  const count = 5 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    flyingHorns.push({
      x: W * (0.1 + Math.random() * 0.8),
      y: groundY() - 4,
      vx: (Math.random() - 0.5) * 240,
      vy: -(860 + Math.random() * 420),
      rot: -Math.PI / 2 + (Math.random() - 0.5) * 0.5,
      vr: (Math.random() - 0.5) * 3.4,
      life: 2.15 + Math.random() * 0.55,
      age: 0,
      scale: 0.9 + Math.random() * 0.85
    });
  }
  sfxHorns();
}

/** 喇叭抛出去之后会减速下落 */
function updateFlyingHorns(dt) {
  for (let i = flyingHorns.length - 1; i >= 0; i--) {
    const h = flyingHorns[i];
    h.age += dt;
    h.vy += 540 * dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += h.vr * dt;
    // 扔上去再落回地板就收掉，不让喇叭停在地上
    if (h.age >= h.life || (h.age > 0.35 && h.y >= groundY() - 8)) flyingHorns.splice(i, 1);
  }
}

/** 一只矢量喇叭，口朝右，调用前自行旋转到朝上 */
function drawOneHorn() {
  ctx.lineJoin = "round";

/** 飞在半空的喇叭。快落地时淡出 */
function drawFlyingHorns() {
  for (const h of flyingHorns) {
    const fade = 1 - Math.max(0, (h.age - h.life * 0.62) / (h.life * 0.38));
    ctx.save();
    ctx.globalAlpha = Math.max(0, fade);
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.scale(h.scale, h.scale);
    drawOneHorn();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/** 纵轴缓动，避免新 K 线一进来整图猛跳 */
let axisMin = null;
let axisMax = null;

/** 只按屏幕里看得到的 K 线定高低点。正在走的那根用已经出现的影线，不提前暴露收盘 */
function viewRange(now) {
  const box = chartBox();
  let minP = Infinity;
  let maxP = -Infinity;
  const take = (high, low) => {
    minP = Math.min(minP, high, low);
    maxP = Math.max(maxP, high, low);
  };
  for (let i = 0; i < candles.length; i++) {
    const x = candleX(i, now, box);
    if (x < box.left - STEP || x > box.right + STEP) continue;
    take(candles[i].h, candles[i].l);
  }
  if (forming) take(Math.max(forming.seenH, forming.live), Math.min(forming.seenL, forming.live));
  if (!isFinite(minP) || !isFinite(maxP)) {
    minP = 10;
    maxP = 20;
  }
  const pad = Math.max(0.25, (maxP - minP) * 0.14);
  const targetMin = minP - pad;
  const targetMax = maxP + pad;
  if (axisMin == null) {
    axisMin = targetMin;
    axisMax = targetMax;
  } else {
    axisMin += (targetMin - axisMin) * 0.08;
    axisMax += (targetMax - axisMax) * 0.08;
  }
  return { minP: axisMin, maxP: axisMax, box };
}

/** 价格转纵坐标 */
function priceToY(price, range) {
  const span = range.maxP - range.minP || 1;
  return range.box.top + (1 - (price - range.minP) / span) * (range.box.bottom - range.box.top);
}

/** 第 i 根已收盘 K 线的横坐标。最新一根贴在右侧，并随着新 K 线平滑左移 */
function candleX(i, now, box) {
  const prog = formProgress(now);
  const head = candles.length + prog;
  return box.right - 8 - (head - i) * STEP;
}

/** 背景、网格、K 线、均线 */
function drawMarket(now) {
  const range = viewRange(now);
  const { box } = range;

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#10192a");
  sky.addColorStop(1, "#070b12");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(232, 238, 247, 0.05)";
  ctx.lineWidth = 1;
  ctx.font = "12px PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(215, 224, 234, 0.45)";
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const price = range.minP + ((range.maxP - range.minP) * i) / ticks;
    const y = priceToY(price, range);
    ctx.beginPath();
    ctx.moveTo(box.left, y);
    ctx.lineTo(box.right, y);
    ctx.stroke();
    ctx.fillText(price.toFixed(2), box.right + 8, y + 4);
  }

  // 5 周期均线，让背景不只是一根根柱子
  ctx.beginPath();
  let started = false;
  ctx.strokeStyle = "rgba(255, 196, 92, 0.55)";
  ctx.lineWidth = 1.4;
  const start = Math.max(4, candles.length - Math.ceil((box.right - box.left) / STEP) - 2);
  for (let i = start; i < candles.length; i++) {
    let sum = 0;
    for (let k = i - 4; k <= i; k++) sum += candles[k].c;
    const x = candleX(i, now, box) + BODY_W / 2;
    const y = priceToY(sum / 5, range);
    if (!started) {
      ctx.moveTo(x, y);
      started = true;
    } else ctx.lineTo(x, y);
  }
  ctx.stroke();

  function drawBar(cd, x, live) {
    const open = cd.o;
    const close = live ? cd.live : cd.c;
    const high = live ? Math.max(cd.seenH, open, close) : cd.h;
    const low = live ? Math.min(cd.seenL, open, close) : cd.l;
    const up = close >= cd.prev;
    const color = up ? "#ff4d4f" : "#14c38e";
    const yH = priceToY(high, range);
    const yL = priceToY(low, range);
    const yO = priceToY(open, range);
    const yC = priceToY(close, range);
    const top = Math.min(yO, yC);
    const bh = Math.max(1, Math.abs(yC - yO));
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x + BODY_W / 2, yH);
    ctx.lineTo(x + BODY_W / 2, yL);
    ctx.stroke();
    ctx.fillRect(x, top, BODY_W, bh);
  }

  for (let i = 0; i < candles.length; i++) {
    const x = candleX(i, now, box);
    if (x < box.left - STEP || x > box.right + STEP) continue;
    drawBar(candles[i], x, false);
  }
  if (forming) {
    const x = candleX(candles.length, now, box);
    drawBar(forming, x, true);
    const y = priceToY(forming.live, range);
    const up = forming.live >= forming.prev;
    ctx.strokeStyle = up ? "rgba(255, 77, 79, 0.85)" : "rgba(20, 195, 142, 0.85)";
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(x + BODY_W + 2, y);
    ctx.lineTo(box.right, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = up ? "#ff4d4f" : "#14c38e";
    roundRect(box.right + 4, y - 9, 56, 18, 3);
    ctx.fill();
    ctx.fillStyle = "#1a0c0c";
    ctx.font = "bold 11px PingFang SC, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(forming.live.toFixed(2), box.right + 32, y + 4);
  }
}

/** 木地板和拍出来的裂纹 */
function drawFloor() {
  const y = groundY();
  const g = ctx.createLinearGradient(0, y - 4, 0, H);
  g.addColorStop(0, "#3a2a1c");
  g.addColorStop(1, "#1a120c");
  ctx.fillStyle = g;
  ctx.fillRect(0, y, W, H - y);
  ctx.strokeStyle = "rgba(255, 220, 170, 0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y + 1);
  ctx.lineTo(W, y + 1);
  ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 46) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (const c of cracks) {
    const a = 1 - c.age / c.life;
    ctx.strokeStyle = `rgba(40, 24, 12, ${0.75 * a})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c.x, y);
    const dirs = [-1.1, -0.45, 0.2, 0.85];
    for (const d of dirs) {
      ctx.moveTo(c.x, y);
      ctx.lineTo(c.x + Math.cos(d + c.seed) * 26, y + 10 + (c.seed % 3));
    }
    ctx.stroke();
  }
}

/** 画一只从画面顶端伸下来的手 */
function drawHand(now) {
  const hand = handTarget(now);
  ctx.save();
  ctx.translate(hand.x, hand.y);
  ctx.rotate(hand.rot);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#2a1a10";

  ctx.lineTo(13, -4);

/** 绳子。松的时候垂成一段软线，绷紧时拉直 */
function drawString(now) {
  const hand = handTarget(now);
  const hat = hatWorld();
  const ret = forming ? (forming.live - forming.prev) / forming.prev : 0;
  ctx.lineWidth = 2.6;
  ctx.lineCap = "round";
  if (hat.slack) {
    ctx.strokeStyle = "rgba(220, 226, 214, 0.45)";
    ctx.beginPath();
    ctx.moveTo(hand.x, hand.y + 6);
    const midY = hand.y + 70 + Math.sin(stateT * 18) * 8;
    ctx.quadraticCurveTo(hand.x + 20, midY, hand.x + Math.sin(stateT * 9) * 16, midY + 24);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.arc(hat.x, hat.y - 4, 5, 0, Math.PI * 1.4);
    ctx.stroke();
    return;
  }
  ctx.strokeStyle = ret >= 0 ? "#ff6b6b" : ret < -0.03 ? "#7dffa8" : "#1ec98a";
  ctx.beginPath();
  ctx.moveTo(hand.x, hand.y + 8);
  const mx = (hand.x + hat.x) / 2 + Math.sin(now / 90) * 2;
  const my = (hand.y + hat.y) / 2;
  ctx.quadraticCurveTo(mx, my, hat.x, hat.y);
  ctx.stroke();
}

/** 按表情画五官 */
function drawFace(expr, flap) {
  ctx.fillStyle = "#ffd2b0";
  ctx.beginPath();
  ctx.arc(0, 40, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "rgba(255, 120, 120, 0.35)";
  ctx.beginPath();
  ctx.ellipse(-10, 46, 4, 2.4, 0, 0, Math.PI * 2);
  ctx.ellipse(10, 46, 4, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();

  if (expr === "fear") {
    ctx.strokeStyle = "#2a1a10";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, 30);
    ctx.lineTo(-6, 33);
    ctx.moveTo(12, 30);
    ctx.lineTo(6, 33);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(-7, 40, 5, 6, 0, 0, Math.PI * 2);
    ctx.ellipse(7, 40, 5, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    ctx.arc(-7, 41, 2.2, 0, Math.PI * 2);
    ctx.arc(7, 41, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7a3148";
    ctx.beginPath();
    ctx.ellipse(0, 50, 4, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (expr === "dead" || expr === "dizzy") {
    ctx.strokeStyle = "#2a1a10";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, 34);
    ctx.lineTo(-4, 42);
    ctx.moveTo(-4, 34);
    ctx.lineTo(-12, 42);
    ctx.moveTo(4, 34);
    ctx.lineTo(12, 42);
    ctx.moveTo(12, 34);
    ctx.lineTo(4, 42);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 50, 4, 0.1, Math.PI - 0.1);
    ctx.stroke();
  } else {
    ctx.fillStyle = "#2a1a10";
    ctx.beginPath();
    if (expr === "gforce") {
      ctx.ellipse(-7, 39, 3.1, 4.2, 0, 0, Math.PI * 2);
      ctx.ellipse(7, 39, 3.1, 4.2, 0, 0, Math.PI * 2);
    } else {
      ctx.ellipse(-7, 39, 2.3, 3.1, 0, 0, Math.PI * 2);
      ctx.ellipse(7, 39, 2.3, 3.1, 0, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.strokeStyle = "#2a1a10";
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (expr === "gforce") ctx.arc(0, 49, 3.4, 0, Math.PI * 2);
    else ctx.arc(0, 49, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }

  // 袖子随摆动张开
  ctx.fillStyle = "#e2b43a";
  ctx.strokeStyle = "#2a1a10";
  ctx.lineWidth = 2;
  roundRect(-40, 62 + flap, 16, 22, 6);
  ctx.fill();
  ctx.stroke();
  roundRect(24, 62 - flap, 16, 22, 6);
  ctx.fill();
  ctx.stroke();
}

/** 阿斗本体。脚底是缩放原点，压扁时脚还贴着地 */
function drawAdu(now) {
  let expr = "blank";
  if (state === "yoyo") expr = yoyoTarget(now).expr;
  else if (state === "windup" || state === "fall") expr = "fear";
  else expr = state === "dazed" ? "dizzy" : "dead";

  const flap = Math.sin(now / 80) * (state === "fall" ? 8 : 3);

  ctx.save();
  if (state === "fall") {
    ctx.translate(aduX, aduY - FOOT * 0.48);
    ctx.rotate(aduRot);
    ctx.scale(aduSx * DRAW, aduSy * DRAW);
    ctx.translate(0, -MODEL_H * 0.52);
  } else {
    ctx.translate(aduX, aduY);
    ctx.rotate(aduRot);
    ctx.scale(aduSx * DRAW, aduSy * DRAW);
    ctx.translate(0, -MODEL_H);
  }

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#2a1a10";
  ctx.fillStyle = "#f0c14b";
  roundRect(-26, 56, 52, 46, 12);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#b71c1c";
  ctx.beginPath();
  ctx.moveTo(0, 60);
  ctx.lineTo(-7, 98);
  ctx.lineTo(7, 98);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#6d4c41";
  ctx.fillRect(-26, 78, 52, 6);

  ctx.fillStyle = "#7a1f1f";
  ctx.font = "bold 13px Songti SC, STSong, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("阿斗", 0, 90);

  ctx.fillStyle = "#24180f";
  ctx.beginPath();
  ctx.ellipse(-14, 104, 8, 4, 0, 0, Math.PI * 2);
  ctx.ellipse(14, 104, 8, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  drawFace(expr, flap);

  // 进贤冠
  ctx.fillStyle = "#241c16";
  ctx.beginPath();
  ctx.moveTo(-22, 30);
  ctx.lineTo(-15, 6);
  ctx.lineTo(15, 6);
  ctx.lineTo(22, 30);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#e6c35c";
  ctx.fillRect(-11, 2, 22, 7);
  ctx.strokeRect(-11, 2, 22, 7);
  ctx.fillStyle = "#d32f2f";
  ctx.beginPath();
  ctx.arc(0, 12, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  if (state === "dazed") {
    ctx.save();
    ctx.translate(aduX, aduY - FOOT * aduSy - 18);
    ctx.fillStyle = "#ffe082";
    ctx.font = "16px serif";
    ctx.textAlign = "center";
    for (let i = 0; i < 3; i++) {
      const a = stateT * 5 + (i * Math.PI * 2) / 3;
      const x = Math.cos(a) * 22;
      const y = Math.sin(a) * 10 - 8;
      ctx.fillText("✦", x, y);
    }
    ctx.restore();
  }
}

/** 尘土和飘字 */
function drawFx() {
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

}

/** 播报画在界面卡片之上，避免被说明和持仓挡住 */
function drawFloaters() {
  for (const f of floaters) {
    const a = f.banner
      ? Math.min(1, (f.life - f.age) / 0.4)
      : 1 - f.age / f.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (f.banner) {
      let size = f.size;
      const maxW = W - 28;
      ctx.font = `bold ${size}px Songti SC, STSong, PingFang SC, serif`;
      while (size > 15 && ctx.measureText(f.text).width > maxW) {
        size -= 1;
        ctx.font = `bold ${size}px Songti SC, STSong, PingFang SC, serif`;
      }
      ctx.font = "12px PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif";
      const titleW = ctx.measureText(f.title || "").width;
      ctx.font = `bold ${size}px Songti SC, STSong, PingFang SC, serif`;
      const textW = ctx.measureText(f.text).width;
      const boxW = Math.min(maxW, Math.max(titleW, textW) + 32);
      const boxH = 46;
      ctx.fillStyle = "rgba(8, 12, 20, 0.86)";
      roundRect(f.x - boxW / 2, f.y - boxH / 2, boxW, boxH, 10);
      ctx.fill();

/** 脚底影子。离地越高，影子越小越淡 */
function drawShadow() {
  const gy = groundY();
  const lift = clamp((gy - aduY) / 520, 0, 1);
  ctx.save();
  ctx.translate(aduX, gy - 1);
  ctx.scale(1.15 - lift * 0.45, 0.28);
  ctx.fillStyle = `rgba(0,0,0,${0.16 + (1 - lift) * 0.22})`;
  ctx.beginPath();
  ctx.ellipse(0, 0, 34, 34, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/** 下坠时的速度线，和拍地时扩开的一圈 */
function drawImpactMarks() {
  if (state === "fall") {
    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const x = aduX - 24 + i * 16;
      ctx.beginPath();
      ctx.moveTo(x, aduY - FOOT - 10);
      ctx.lineTo(x, aduY - FOOT - 36 - i * 8);
      ctx.stroke();
    }
  }
  if (state === "splat" || (state === "dazed" && stateT < 0.4)) {
    const t = state === "splat" ? stateT : 0.22 + stateT;
    ctx.strokeStyle = `rgba(255, 226, 170, ${Math.max(0, 0.8 - t * 1.6)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(aduX, groundY(), 24 + t * 220, 7 + t * 18, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/** 金额缩成万，卡片里放得下 */
function moneyText(n) {
  const sign = n < 0 ? "-" : "";
  const v = Math.abs(n);
  if (v >= 10000) return `${sign}${(v / 10000).toFixed(2)}万`;
  return `${sign}${v.toFixed(0)}`;
}

/** 净资产 = 现金 + 持仓市值。现金为负时市值大于净资产，杠杆率就会超过 100% */
function equityOf(price) {
  return cash + shares * price;
}

/** 杠杆率 = 持仓市值 / 净资产。没有正的净资产时视为已经超过强平线 */
function leverageOf(price) {
  const mv = shares * price;
  const equity = equityOf(price);
  if (mv <= 0) return equity < 0 ? Infinity : 0;
  if (equity <= 0) return Infinity;
  return mv / equity;
}

function leverageText(price) {
  const lev = leverageOf(price);
  if (!Number.isFinite(lev)) return "≥200%";
  return `${Math.round(lev * 100)}%`;
}

/** 持仓盈亏、现金和杠杆。红为赚，绿为亏；现金为负时杠杆用金色到红色 */
function drawAccount(price) {
  const pnl = (price - avgCost) * shares;
  const pnlPct = avgCost > 0 ? (price - avgCost) / avgCost : 0;
  const profit = pnl >= 0;

  ctx.textAlign = "left";

  ctx.fillText(`输送天意  ${heavenCount} 次${boostText}`, left, box.y + 18);

  ctx.font = "bold 13px PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif";
  ctx.fillStyle = profit ? "#ff4d4f" : "#14c38e";

  const cashText = `现金 ${moneyText(cash)}`;
  ctx.font = "bold 13px PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif";
  const pnlW = ctx.measureText(pnlText).width;
  const cashW = ctx.measureText(cashText).width;
  const rowY = box.y + 84;
  ctx.fillStyle = profit ? "#ff4d4f" : "#14c38e";

/** 输送天意。键盘和底部按钮都走这里，按住不连发由调用方保证 */
function sendHeaven() {
  if (liquidated) return;
  heavenCount += 1;
  heavenBoost = Math.min(HEAVEN_CAP, heavenBoost + HEAVEN_STEP);
  taleBoost = Math.min(TALE_BOOST_CAP, taleBoost + TALE_BOOST_STEP);
  if (Math.random() < LIMIT_DOWN_P) heavenLimitDown = true;
  const heavenMsg = announceAt(0, -36);
  floaters.push({
    text: "天意",
    x: heavenMsg.x,
    y: heavenMsg.y,
    vy: -10,
    life: 0.9,
    age: 0,
    size: 32,
    color: "#ffe7a3"
  });
  sfxHeaven();
}

/** 按现价加一笔仓。现金可以为负，负了以后杠杆率按市值除以净资产算 */
function addPosition() {
  if (liquidated) return;
  const px = livePrice();
  if (!(px > 0)) return;
  if (shares <= 0) avgCost = px;
  else avgCost = (avgCost * shares + px * ADD_SHARES) / (shares + ADD_SHARES);
  shares += ADD_SHARES;
  cash -= px * ADD_SHARES;
  const addMsg = announceAt(0, 36);
  floaters.push({
    text: "加仓",
    x: addMsg.x,
    y: addMsg.y,
    vy: -10,
    life: 0.9,
    age: 0,
    size: 30,
    color: "#ffd27a"
  });
  // 现金还是正的，只响加仓；买成负债就改响加杠杆
  if (cash < 0) sfxLeverage();
  else sfxAdd();
  maybeLiquidate(px);
}

/** 按现价卖出 200 股。不够 200 就卖光 */
function sellPosition() {
  if (liquidated || shares <= 0) return;
  const px = livePrice();
  if (!(px > 0)) return;
  const n = Math.min(SELL_SHARES, shares);
  cash += px * n;
  shares -= n;
  if (shares <= 0) avgCost = 0;
  const msg = announceAt(0, 36);
  floaters.push({
    text: "卖出",
    x: msg.x,
    y: msg.y,
    vy: -10,
    life: 0.9,
    age: 0,
    size: 30,
    color: "#9fd0ff"
  });
  sfxSell();
}

/** 当前用来成交的价格。有正在走的 K 线就用它的现价 */
function livePrice() {
  return forming ? forming.live : lastClose;
}

/** 负债利息。杠杆越高，这一次扣得越多 */
function chargeInterest(price) {
  if (!(cash < 0)) return;
  const lev = leverageOf(price);
  const rate = (Number.isFinite(lev) ? Math.max(0, lev - 1) : 1) * INTEREST_SLOPE;
  const interest = (-cash) * rate;
  if (!(interest > 0)) return;
  cash -= interest;
  const spot = announceAt(0, 56);
  floaters.push({
    text: `利息 -${moneyText(interest)}`,
    x: spot.x,
    y: spot.y,
    vy: -8,
    life: 1.2,
    age: 0,
    size: 26,
    color: "#ff9f6b"
  });
}

/** 用现价刷新这一把的最高净资产和最高盈利比 */
function notePeak(price) {
  const equity = equityOf(price);
  const ratio = initialEquity > 0 ? (equity - initialEquity) / initialEquity : 0;
  if (equity > peakEquity) peakEquity = equity;
  if (ratio > peakRatio) peakRatio = ratio;
}

/** 杠杆到 200% 就停盘，弹出这一把的结算 */
function maybeLiquidate(price) {
  if (liquidated) return true;
  notePeak(price);
  if (leverageOf(price) < LIQUIDATION_LEV) return false;
  liquidated = true;
  sfxLiquidate();
  const equity = equityOf(price);
  const pnl = equity - initialEquity;
  const ratio = initialEquity > 0 ? pnl / initialEquity : 0;
  const sign = pnl > 0 ? "+" : "";
  const peakSign = peakRatio > 0 ? "+" : "";
  const body = document.getElementById("settle-body");
  body.replaceChildren();
  const rows = [
    `注入天意  ${heavenCount} 次`,
    `盈亏比  ${sign}${(ratio * 100).toFixed(2)}%（${sign}${pnl.toFixed(2)}）`,
    `最高盈利比  ${peakSign}${(peakRatio * 100).toFixed(2)}%`,
    `最高净资产  ${moneyText(peakEquity)}`,
    `阿斗摔倒  ${slamCount} 次`,
    `遇到的事件  ${seenTales.length ? seenTales.join("、") : "无"}`
  ];
  for (const text of rows) {
    const p = document.createElement("p");
    p.textContent = text;
    if (text.startsWith("遇到的事件")) p.className = "events";
    body.appendChild(p);
  }
  document.getElementById("settle").hidden = false;
  return true;
}

/**
 * 原创秋雨循环，只用网页音频合成，不附带任何歌曲录音。
 * musicOn 为关时总音量为 0；滑块改的是开着时候的音量。
 */
let audioCtx = null;
let musicGain = null;
let musicOn = false;
let musicVol = 0.4;
/** 宫商角徵羽，相对宫音的半音。传统大调五声，没有清角、变宫 */
const PENTA = [0, 2, 4, 7, 9];
const GONG_HZ = 392;
const BEAT = 0.46;
/** 旋律音域。只在这一段里走，不靠八度折返制造跳跃 */
const DEG_LO = -1;
const DEG_HI = 5;
let phrase = [];
let degree = 0;
let scheduledUntil = 0;
/**
 * 五声里常见的双音，按名曲的走向排好。
 * 比较时不分上下位置：宫徵和徵宫算同一对。同一对最多连着两次。
 */
const DYAD_RUN = [
  [0, 3],
  [0, 2],
  [3, 1],
  [1, 4],
  [4, 2],
  [2, 3],
  [4, 0],
  [1, 3],
  [2, 0],
  [4, 1]
];
let dyadIx = 0;
let dyadStreak = 0;
let lastDyadKey = "";

/** 把一对音收成与顺序无关的标记 */
function dyadKey(pair) {
  return pair[0] < pair[1] ? pair[0] + "," + pair[1] : pair[1] + "," + pair[0];
}

/** 下一对双音。已经连用两次的，跳到下一对不一样的 */
function nextDyad() {
  let pair = DYAD_RUN[dyadIx % DYAD_RUN.length];
  let key = dyadKey(pair);
  let guard = 0;
  while (key === lastDyadKey && dyadStreak >= 2 && guard < DYAD_RUN.length) {
    dyadIx += 1;
    pair = DYAD_RUN[dyadIx % DYAD_RUN.length];
    key = dyadKey(pair);
    guard += 1;
  }
  dyadIx += 1;
  dyadStreak = key === lastDyadKey ? dyadStreak + 1 : 1;
  lastDyadKey = key;
  return pair.slice();
}
/**
 * 四首曲子按套曲顺序接，不中途抽签。
 * steps 是五声音级的音程：1 级进，2 小跳后必须反向级进。
 * 春江是流水级进，梅花同一动机连奏三遍，阳关以长音叠三次，茉莉先跳进再级进下行。
 * repeat 的几遍旋律相同，但每一遍换一对双音，同一对最多连着两次。
 * lift 是第三遍前的级进爬高；tail 是叠句末尾的长音，不是休止。
 */
const TUNES = [
  {
    name: "春江",
    plan: [
      { chord: "zhi", beats: [1, 0.5, 0.5, 1, 1, 0.5, 0.5, 2], steps: [1, 1, -1, 1, 2, -1, -1] },
      { chord: "gong", beats: [0.5, 0.5, 1, 0.5, 0.5, 1, 1, 2], steps: [-1, 1, 1, -1, -1, 1, -1] },
      { chord: "yu", beats: [1, 1, 0.5, 0.5, 1, 1, 2], steps: [1, -1, 1, -1, -1, 0] },
      { chord: "zhi", beats: [1, 0.5, 0.5, 1, 1, 2], steps: [1, 1, -1, -1, -1] },
      { chord: "gong", beats: [1, 1, 1, 1, 2, 2], steps: [-1, 1, -1, -1, 0] }
    ]
  },
  {
    name: "梅花",
    plan: [
      { chord: "gong", beats: [1, 0.5, 0.5, 2], steps: [1, -1, 0], repeat: 3, lift: 1 },
      { chord: "shang", beats: [1, 1, 2], steps: [-1, 1], repeat: 3 },
      { chord: "zhi", beats: [0.5, 0.5, 1, 2], steps: [1, -1, 0], repeat: 3, lift: 1 },
      { chord: "gong", beats: [1, 1, 2, 2], steps: [-1, -1, 0] }
    ]
  },
  {
    name: "茉莉",
    plan: [
      { chord: "gong", beats: [0.5, 0.5, 1, 0.5, 0.5, 1, 2], steps: [2, -1, -1, 1, -1, -1] },
      { chord: "zhi", beats: [0.5, 0.5, 1, 1, 1, 2], steps: [1, 1, -1, 0, -1] },
      { chord: "gong", beats: [1, 0.5, 0.5, 1, 0.5, 0.5, 2], steps: [-1, 1, 1, -1, -1, 0] },
      { chord: "yu", beats: [0.5, 0.5, 1, 0.5, 0.5, 1, 2], steps: [1, -1, 1, -1, -1, 0] },
      { chord: "gong", beats: [1, 1, 1, 1, 2, 2], steps: [-1, -1, 1, -1, 0] }
    ]
  },
  {
    name: "阳关",
    plan: [
      { chord: "yu", beats: [2, 1, 1, 2], steps: [1, -1, 1], repeat: 3, tail: [2, 2] },
      { chord: "shang", beats: [2, 2, 1, 1], steps: [-1, 1, -1], repeat: 3, tail: [2] },
      { chord: "yu", beats: [1, 1, 2, 2], steps: [1, 1, -1], repeat: 3, tail: [2, 2] },
      { chord: "gong", beats: [2, 1, 1, 2], steps: [-1, -1, 0], repeat: 3, tail: [2, 2] }
    ]
  }
];
let tuneIx = 0;
let planIx = 0;

function applyMusicGain() {
  if (!musicGain || !audioCtx) return;
  musicGain.gain.setTargetAtTime(musicOn ? musicVol : 0, audioCtx.currentTime, 0.04);
}

/** 第一次操作时才创建音频，避开浏览器对自动播放的限制 */
function ensureMusic() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(audioCtx.destination);
    const seconds = 2;
    const count = Math.floor(audioCtx.sampleRate * seconds);
    const buffer = audioCtx.createBuffer(1, count, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let brown = 0;
    for (let i = 0; i < count; i++) {
      brown = (brown + (Math.random() * 2 - 1) * 0.02) * 0.96;
      data[i] = brown * 0.22;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 520;
    const rain = audioCtx.createGain();
    // 雨声只做很轻的底，不要盖过旋律和音效
    rain.gain.value = 0.045;
    src.connect(filter);
    filter.connect(rain);
    rain.connect(musicGain);
    src.start();
    scheduledUntil = 0;
    phrase = [];
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  applyMusicGain();
}

/** 五声音级换成频率。0 是宫，4 是羽，5 起进入高一个宫 */
function freqOf(deg) {
  const oct = Math.floor(deg / 5);
  const i = ((deg % 5) + 5) % 5;
  return GONG_HZ * Math.pow(2, oct + PENTA[i] / 12);
}

/** 级进。走出音域就折返一级，不跳八度 */
function clampStep(deg, step) {
  const next = deg + step;
  if (next > DEG_HI || next < DEG_LO) {
    const back = deg - Math.sign(step || 1);
    if (back <= DEG_HI && back >= DEG_LO) return back;
    return deg;
  }
  return next;
}

/** 按音程表写出一句。小跳之后的下一音强制反向级进 */
function spellLine(beats, steps, start) {
  const notes = [{ rest: false, beats: beats[0], degree: start }];
  let prev = 0;
  for (let i = 0; i < steps.length; i++) {
    let step = steps[i];
    if (Math.abs(prev) >= 2) step = prev > 0 ? -1 : 1;
    const next = clampStep(notes[notes.length - 1].degree, step);
    prev = next - notes[notes.length - 1].degree;
    notes.push({ rest: false, beats: beats[i + 1], degree: next });
  }
  return notes;
}

/**
 * 把计划里的一句展开成连续的音。
 * 重复用同一串音高；每一遍换一对双音，不让同一对垫太久。
 */
function expandItem(item) {
  const repeats = item.repeat || 1;
  const motif = spellLine(item.beats, item.steps, degree);
  const out = [];
  for (let r = 0; r < repeats; r++) {
    const lastRepeat = r === repeats - 1;
    if (lastRepeat && repeats > 1 && item.lift) {
      let cursor = out.length ? out[out.length - 1].degree : degree;
      const bridge = [];
      for (let k = 0; k < item.lift; k++) {
        cursor = clampStep(cursor, 1);
        bridge.push({ rest: false, beats: 0.5, degree: cursor });
      }
      bridge[0].padChord = nextDyad();
      out.push(...bridge, ...spellLine(item.beats, item.steps, cursor));
    } else {
      const played = motif.map((n) => ({ rest: false, beats: n.beats, degree: n.degree }));
      played[0].padChord = nextDyad();
      out.push(...played);
    }
  }
  if (item.tail) {
    const hold = out[out.length - 1].degree;
    for (const beats of item.tail) out.push({ rest: false, beats, degree: hold });
  }
  let root = 0;
  for (const n of out) if (n.padChord) root = n.padChord[0];
  const last = out[out.length - 1];
  const prev = out.length > 1 ? out[out.length - 2].degree : last.degree;
  const delta = root - last.degree;
  if (delta !== 0) {
    const want = last.degree + Math.sign(delta);
    if (want >= DEG_LO && want <= DEG_HI && Math.abs(want - prev) <= 2) last.degree = want;
  }
  let i = 0;
  while (i < out.length) {
    if (!out[i].padChord) {
      i += 1;
      continue;
    }
    let beats = 0;
    let j = i;
    while (j < out.length && (j === i || !out[j].padChord)) {
      beats += out[j].beats;
      j += 1;
    }
    out[i].padBeats = beats;
    i = j;
  }
  degree = last.degree;
  return out;
}

/** 下一句。同一首曲子走完才换下一首，中间不插休止 */
function pushPhrase() {
  const tune = TUNES[tuneIx % TUNES.length];
  const item = tune.plan[planIx];
  const notes = expandItem(item);
  for (const n of notes) n.voice = "flute";
  phrase.push(...notes);
  planIx += 1;
  if (planIx >= tune.plan.length) {
    planIx = 0;
    tuneIx = (tuneIx + 1) % TUNES.length;
  }
}

/**
 * 笛、箫、筝同时铺在同一条旋律上，比例固定，整首都不换组。
 * 短音少用起音，让下一颗音接上。三件的音量加起来仍保持很轻。
 */
function playVoice(when, freq, dur) {
  const hold = dur + (dur < 0.55 ? 0.1 : 0.14);
  const end = when + hold;
  const ensemble = [
    {
      attack: Math.min(0.05, Math.max(0.016, dur * 0.2)),
      peak: 0.02,
      layers: [
        { type: "sine", mul: 1, gain: 0.78 },
        { type: "triangle", mul: 2, gain: 0.07 }
      ]
    },
    {
      attack: Math.min(0.09, Math.max(0.03, dur * 0.28)),
      peak: 0.009,
      layers: [
        { type: "sine", mul: 1, gain: 0.88 },
        { type: "sine", mul: 2, gain: 0.08 }
      ]
    },
    {
      attack: Math.min(0.035, Math.max(0.012, dur * 0.15)),
      peak: 0.01,
      layers: [
        { type: "triangle", mul: 1, gain: 0.55 },
        { type: "triangle", mul: 1.003, gain: 0.32 }
      ]
    }
  ];
  ensemble.forEach((part) => {
    const releaseAt = when + Math.max(part.attack + 0.04, hold * 0.72);
    part.layers.forEach((layer) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = layer.type;
      osc.frequency.setValueAtTime(freq * layer.mul, when);
      const level = part.peak * layer.gain;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(level, when + part.attack);
      g.gain.linearRampToValueAtTime(Math.max(0.0002, level * 0.82), releaseAt);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(g);
      g.connect(musicGain);
      osc.start(when);
      osc.stop(end + 0.02);
    });
  });
}

/** 上一组和声的音高，换和弦时就近找八度，避免低音突然翻高 */
let padHz = null;
let lastChordKey = "";

/** 按当前这对双音铺两个很轻的音。同一对续着，换一对时慢慢叠过去 */
function playPad(when, dur, chord) {
  const tones = chord && chord.length ? chord.slice(0, 2) : [0, 3];
  const key = dyadKey(tones);
  const cont = key === lastChordKey;
  lastChordKey = key;
  const base = tones.map((deg) => freqOf(deg) / 2);
  const freqs = base.map((hz) => {
    if (!padHz) return hz;
    let best = hz;
    let bestScore = Infinity;
    for (const oct of [0.5, 1, 2]) {
      const cand = hz * oct;
      let score = Infinity;
      for (const old of padHz) score = Math.min(score, Math.abs(Math.log2(cand / old)));
      if (score < bestScore) {
        bestScore = score;
        best = cand;
      }
    }
    return best;
  });
  padHz = freqs.slice();
  const end = when + dur + 0.6;
  const mid = Math.min(end - 0.08, when + Math.max(0.4, dur * 0.7));
  const attack = cont ? 0.06 : 0.5;
  freqs.forEach((hz, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(hz, when);
    const peak = i === 0 ? 0.0042 : 0.0024;
    g.gain.setValueAtTime(cont ? peak * 0.65 : 0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak * 0.8), mid);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.connect(g);
    g.connect(musicGain);
    osc.start(when);
    osc.stop(end + 0.02);
  });
}

/** 往前排两秒左右的旋律。声音关掉时不排，避免积一长串 */
function updateMusic() {
  if (!musicOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  if (scheduledUntil < now + 0.02) scheduledUntil = now + 0.05;
  while (scheduledUntil < now + 2.2) {
    if (!phrase.length) pushPhrase();
    const n = phrase.shift();
    const dur = Math.max(0.08, n.beats * BEAT);
    if (n.padBeats) playPad(scheduledUntil, n.padBeats * BEAT, n.padChord);
    if (!n.rest) playVoice(scheduledUntil, freqOf(n.degree), dur);
    scheduledUntil += dur;
  }
}

/**
 * 音效走同一路总音量。声音关掉，或还没点开过声音时，直接不响。
 * peak 是进总音量之前的响度。
 */
function playTone(when, freq, dur, type, peak, slideTo) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(40, freq), when);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), when + dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), when + Math.min(0.03, dur * 0.25));
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(g);
  g.connect(musicGain);
  osc.start(when);
  osc.stop(when + dur + 0.02);
}

/** 落地的一声闷响 */
function noiseThud(when, dur, peak) {
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 180;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(peak, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(musicGain);
  src.start(when);
  src.stop(when + dur + 0.02);
}

function canPlaySfx() {
  return musicOn && audioCtx && musicGain;
}

/** 下坠时的短下滑音 */
function sfxFall() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 640, 0.22, "sine", 0.05, 180);
}

/** 拍在地上 */
function sfxSplat() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 140, 0.26, "sine", 0.2, 46);
  noiseThud(t, 0.14, 0.16);
}

/** 往上扔喇叭时响三声，不按只数叠 */
function sfxHorns() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  for (let i = 0; i < 3; i++) {
    playTone(t + i * 0.09, 360 + i * 40, 0.14, "triangle", 0.07, 620 + i * 30);
  }
}

/** 输送天意：上行的三声 */
function sfxHeaven() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 784, 0.16, "sine", 0.09);
  playTone(t + 0.07, 988, 0.18, "sine", 0.08);
  playTone(t + 0.14, 1318, 0.26, "sine", 0.07);
}

/** 加仓：两声轻响 */
function sfxAdd() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 880, 0.08, "sine", 0.08);
  playTone(t + 0.06, 1174, 0.14, "sine", 0.07);
}

/** 卖出：三声下行，和加仓的上行分开 */
function sfxSell() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 740, 0.09, "sine", 0.08);
  playTone(t + 0.07, 554, 0.1, "sine", 0.07);
  playTone(t + 0.14, 415, 0.16, "sine", 0.06);
}

/** 现金买成负数、杠杆垫上去时的低音警告 */
function sfxLeverage() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 196, 0.18, "triangle", 0.1, 147);
  playTone(t + 0.12, 294, 0.2, "sine", 0.06);
}

/** 强平结算：短促下落，比摔倒轻 */
function sfxLiquidate() {
  if (!canPlaySfx()) return;
  const t = audioCtx.currentTime;
  playTone(t, 523, 0.12, "sine", 0.09, 262);
  playTone(t + 0.1, 330, 0.16, "triangle", 0.07, 165);
  noiseThud(t + 0.12, 0.12, 0.08);
}

function syncMusicButton() {
  const btn = document.getElementById("btn-music");
  btn.textContent = musicOn ? "声音开" : "声音关";
  btn.classList.toggle("ghost", !musicOn);
  btn.setAttribute("aria-pressed", musicOn ? "true" : "false");
}

/** 上方向键输送天意，空格加仓，S 卖出。按住不连发 */
function onKeyDown(e) {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (liquidated) return;
  if (e.key === "ArrowUp") {
    e.preventDefault();
    sendHeaven();
    return;
  }
  if (e.key === " ") {
    e.preventDefault();
    addPosition();
    return;
  }
  if (e.key === "s" || e.key === "S") {
    e.preventDefault();
    sellPosition();
  }
}

/** 整帧 */
function draw(now) {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 1.6, (Math.random() - 0.5) * shake * 1.6);
  }
  drawMarket(now);
  drawFloor();
  drawShadow();
  drawString(now);
  drawHand(now);
  drawImpactMarks();
  drawAdu(now);
  drawFlyingHorns();
  drawFx();
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  drawHud(now);
  drawFloaters();
}

/** 适配窗口和视网膜屏。高度去掉底部操作条，地面仍留在画面里 */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  W = Math.max(1, rect.width);
  H = Math.max(1, rect.height);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

let last = 0;
/** 主循环。dt 封顶，避免切回标签页时一下子摔穿地板 */
function frame(now) {
  if (!last) {
    last = now;
    bootstrapMarket(now);
    const pose = yoyoTarget(now);
    aduX = pose.x;
    aduY = pose.y;
  }
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt, now);
  updateMusic(now);
  draw(now);
  requestAnimationFrame(frame);
}

document.getElementById("btn-heaven").addEventListener("click", sendHeaven);
document.getElementById("btn-add").addEventListener("click", addPosition);
document.getElementById("btn-sell").addEventListener("click", sellPosition);
document.getElementById("btn-next").addEventListener("click", nextRound);
document.getElementById("btn-music").addEventListener("click", () => {
  musicOn = !musicOn;
  syncMusicButton();
  if (musicOn) ensureMusic();
  else applyMusicGain();
});
document.getElementById("vol").addEventListener("input", (e) => {
  musicVol = Number(e.target.value) / 100;
  if (musicOn) ensureMusic();
  else applyMusicGain();
});
syncMusicButton();
resize();
window.addEventListener("resize", resize);
window.addEventListener("keydown", onKeyDown);
requestAnimationFrame(frame);
</script>
